name: run-evidence-gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  universal-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Gate 1: schema-cache-freshness
      - name: schema-cache-freshness
        run: python scripts/check_schema_cache_freshness.py

      # Gate 2: voice-lint
      - name: voice-lint
        run: python scripts/voice_lint.py

      # Gate 3: bom-check
      - name: bom-check
        run: python scripts/check_no_bom.py

      # Gate 4: spec-check
      - name: spec-check
        run: python scripts/spec_check.py

      # Gate 5: decisions-validation
      - name: decisions-validation
        run: python scripts/validate_decisions.py

      # Companion typed-artifact validators (CDCP governance)
      - name: roles-validation
        run: python scripts/validate_roles.py

      - name: tools-validation
        run: python scripts/validate_tools.py

      - name: policies-validation
        run: python scripts/validate_policies.py

      - name: skills-validation
        run: python scripts/validate_skills.py

      - name: dreams-validation
        run: python scripts/validate_dreams.py

      - name: schemas-validation
        run: python scripts/validate_schemas.py

      # Gate 7: language-test-runner (pytest)
      - name: pytest
        run: python -m pytest -q

  consumer-gates:
    # trace-to-eval-harness-specific gates (DEC-CDCP-015 contract):
    # 11. all-example-packets-validate
    # 12. uri-resolver-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Gate 11: all-example-packets-validate
      - name: all-example-packets-validate
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for packet in examples/run_evidence/*.packet.json; do
            echo "::group::validate $packet"
            python -m trace_to_eval evidence validate "$packet"
            echo "::endgroup::"
            count=$((count+1))
          done
          if [ "$count" -eq 0 ]; then
            echo "ERROR: no packets found under examples/run_evidence/*.packet.json"
            exit 1
          fi
          echo "validated $count packet(s)"

      # Gate 12: uri-resolver-tests
      - name: uri-resolver-tests
        run: python -m pytest -q tests/test_uri.py tests/test_run_evidence.py
