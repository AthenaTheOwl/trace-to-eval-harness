[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-to-eval-harness"
version = "0.1.0"
description = "Turn failed AI traces into deterministic eval cases and regression reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
trace-to-eval = "trace_to_eval.cli:main"

[tool.setuptools.packages.find]
include = ["trace_to_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

